# A separate, explicitly static demonstration; no live API, keys, database, or host access.
name: homelab-demo
services:
  demo:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    command: [caddy, file-server, --root, /srv/demo, --listen, ':8080']
    ports: [127.0.0.1:8088:8080]
    volumes: [./demo:/srv/demo:ro]
    read_only: true
    user: "10001:10001"
    tmpfs: ["/config:uid=10001,gid=10001,mode=0700", "/data:uid=10001,gid=10001,mode=0700"]
    cap_drop: [ALL]
    # Official Caddy binary carries a bind capability; retain it to execute as nonroot.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [demo]
    mem_limit: 128m
networks:
  demo: {}
