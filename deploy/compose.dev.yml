# Explicit override; all durable data still uses the selected development DATA_DIR.
services:
  api:
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
    ports: [127.0.0.1:3000:3000]
  web:
    extends:
      file: compose.yml
      service: api
    command: [npm, run, dev, --workspace, '@homelab/web', --, --host, 0.0.0.0]
    environment:
      API_PROXY_TARGET: http://api:3000
    ports: [127.0.0.1:5173:5173]
    healthcheck:
      disable: true
  proxy:
    profiles: [production-proxy]
