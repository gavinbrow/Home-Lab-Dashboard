name: homelab-control
x-app: &app
  image: ${APP_IMAGE:-homelab-control:0.1.0}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: runtime
  init: true
  restart: unless-stopped
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=128m,mode=1777"]
  secrets: [runtime_env]
  environment: &app-env
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "3000"
    APP_ORIGIN: https://${DASHBOARD_HOST:?Set DASHBOARD_HOST}
    COOKIE_SECURE: "true"
    ARTIFACT_ROOT: /data/artifacts
    DISPATCH_ENABLED: ${DISPATCH_ENABLED:-false}
    RESTORE_MODE: ${RESTORE_MODE:-false}
  volumes:
    - ${DATA_DIR:?Set absolute DATA_DIR}/artifacts:/data/artifacts
  networks: [internal, outbound]
  depends_on:
    postgres:
      condition: service_healthy
  stop_grace_period: 30s
  mem_limit: 1g
  pids_limit: 256
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    environment:
      POSTGRES_DB: homelab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password]
    volumes:
      - ${DATA_DIR:?Set absolute DATA_DIR}/postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d homelab"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 60s
  migrate:
    <<: *app
    restart: "no"
    profiles: [tools]
    secrets: !override [migration_env]
    command: [npm, run, db:migrate]
  provision:
    <<: *app
    restart: "no"
    profiles: [tools]
    user: "0:0"
    secrets: !override [database_admin_url, app_password, migration_password]
    environment:
      DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
      EXPECTED_DATABASE: homelab
      APP_DB_ROLE: homelab_app
      APP_DB_PASSWORD_FILE: /run/secrets/app_password
      MIGRATION_DB_ROLE: homelab_migrator
      MIGRATION_DB_PASSWORD_FILE: /run/secrets/migration_password
    command: [npm, run, db:provision]
  api:
    <<: *app
    command: [npm, run, start:api]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    <<: *app
    image: ${WORKER_IMAGE:-homelab-control-worker:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: backup-worker
    command: [npm, run, start, --workspace, '@homelab/worker']
    # Disabled by default; DB runtime_control is an additional independent fence.
    profiles: [execution]
    healthcheck:
      test: [CMD, node, -e, "const fs=require('node:fs');const t=Date.parse(fs.readFileSync('/tmp/homelab-worker-health','utf8'));process.exit(Number.isFinite(t)&&Date.now()-t<30000?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
  proxy:
    image: homelab-control-proxy:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: proxy
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    environment:
      DASHBOARD_HOST: ${DASHBOARD_HOST:?Set DASHBOARD_HOST}
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:443:443
    volumes:
      - ${DATA_DIR:?Set absolute DATA_DIR}/caddy-data:/data
      - ${DATA_DIR:?Set absolute DATA_DIR}/caddy-config:/config
    networks: [internal, outbound]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, caddy, validate, --config, /etc/caddy/Caddyfile]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    pids_limit: 128
networks:
  internal:
    internal: true
  outbound: {}
secrets:
  app_password:
    file: ${CONFIG_DIR:?Set absolute CONFIG_DIR}/app-password
  migration_password:
    file: ${CONFIG_DIR:?Set absolute CONFIG_DIR}/migration-password
  database_admin_url:
    file: ${CONFIG_DIR:?Set absolute CONFIG_DIR}/database-admin-url
  migration_env:
    file: ${CONFIG_DIR:?Set absolute CONFIG_DIR}/migration.env
  runtime_env:
    file: ${CONFIG_DIR:?Set absolute CONFIG_DIR}/runtime.env
  postgres_admin_password:
    file: ${CONFIG_DIR:?Set absolute CONFIG_DIR}/postgres-admin-password
